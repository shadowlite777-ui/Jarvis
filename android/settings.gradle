pluginManagement {
    def flutterSdkPath = System.getenv("FLUTTER_ROOT")
    if (flutterSdkPath == null) {
        def properties = new Properties()
        def propertiesFile = new File('local.properties')
        if (propertiesFile.exists()) {
            properties.load(new FileInputStream(propertiesFile))
            flutterSdkPath = properties.getProperty('flutter.sdk')
        }
    }
    
    // Если путь всё еще не найден, пытаемся получить его через системное окружение flutter
    if (flutterSdkPath == null) {
        try {
            flutterSdkPath = 'flutter'.execute().text.readLines().find { it.contains('Flutter SDK path:') }?.replaceAll('Flutter SDK path:', '')?.trim()
        } catch (Exception ignored) {}
    }

    if (flutterSdkPath != null) {
        includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        if (flutterSdkPath != null) {
            maven {
                url "$flutterSdkPath/bin/cache/artifacts/engine-gradle-maven"
            }
            maven {
                url "$flutterSdkPath/packages/flutter_tools/gradle"
            }
        }
    }
}

plugins {
    id "dev.flutter.plugin-loader" version "1.0.0"
    id "com.android.application" version "7.3.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

include ":app"
